[package]
name = "liquidation_bot"
version = "0.1.0"
edition = "2024"

[dependencies]
alloy = { version = "1.0.9", features = ["provider-ws",
    "sol-types", "contract", "transport-ws", "transports", "rpc-types",
    "json-rpc"] }
clap = { version = "4.5.39", features = ["derive"] }
eyre = "0.6.12"
ndarray = "0.16.1"
tokio = { version = "1.45.1", features = ["rt", "rt-multi-thread", "macros"] }
tracing = "0.1.41"
tracing-subscriber = { version = "0.3.19", features = ["env-filter"] }
futures = "0.3.31"
dashmap = "6.1.0"
bitvec = "1.0.1"
chrono = "0.4.41"
mockall = "0.13.1"
alloy-primitives = "1.3.0"
serde_json = "1.0.140"
